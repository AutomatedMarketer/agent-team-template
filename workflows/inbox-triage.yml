# Your inbox, sorted into what needs you, what got a drafted reply, and noise.
# Reads, labels, drafts. Sends nothing — that boundary is structural.
name: Inbox Triage
owner: email
steps: [triage-inbox, draft-replies]
trigger:
  armed: false
  reason: "Off until an inbox is connected - it has nothing to read yet."
  schedule: "weekdays 08:00"
  fire: true
output: inbox/{date}/inbox-triage.md
